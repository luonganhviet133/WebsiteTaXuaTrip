name = "websitetaxuatrip"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Builds chạy `npx wrangler deploy`; lệnh này build giao diện vào dist/client trước khi upload.
[build]
command = "npm run build:client"

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taxua-trip-db"
database_id = "70511a20-b9e0-4069-8eb9-e1eb87cf9406"
migrations_dir = "migrations_d1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private"

[vars]
NODE_ENV = "production"
