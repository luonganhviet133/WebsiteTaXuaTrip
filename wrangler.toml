name = "websitetaxuatrip"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Builds chạy `npm run deploy` (main) / `npm run deploy:preview` (nhánh khác): áp migration D1 rồi
# `wrangler deploy` / `wrangler preview`; lệnh [build] build giao diện vào dist/client trước khi upload.
[build]
command = "node scripts/build-worker-assets.mjs"

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taxua-trip-db"
database_id = "70511a20-b9e0-4069-8eb9-e1eb87cf9406"
migrations_dir = "migrations_d1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private"

[vars]
NODE_ENV = "production"

# Bản xem trước cho các nhánh khác main (Workers Builds chạy `npx wrangler preview`).
# Dùng tài nguyên riêng, không đụng D1/R2 production. NODE_ENV = production để đăng ký/đăng nhập
# bị chặn (503) cho tới khi thêm TURNSTILE_SECRET_KEY ở mục Previews Base của Worker.
[previews.vars]
NODE_ENV = "production"

[[previews.d1_databases]]
binding = "DB"
database_id = "22280e1e-e2b5-4bec-9473-122d81a0098c"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media-preview"

[[previews.r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private-preview"
