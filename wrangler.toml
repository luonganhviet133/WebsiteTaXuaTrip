name = "taxua-trip"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taxua-trip-db"
database_id = "local-taxua-trip-d1"
migrations_dir = "migrations_d1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private"

[vars]
NODE_ENV = "production"
