name = "websitetaxuatrip"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Builds chạy `npm run deploy` (main) / `npm run deploy:preview` (nhánh khác): áp migration D1 rồi
# `wrangler deploy` / `wrangler preview`; lệnh [build] build giao diện vào dist/client trước khi upload.
[build]
command = "node scripts/build-worker-assets.mjs"

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taxua-trip-db"
database_id = "70511a20-b9e0-4069-8eb9-e1eb87cf9406"
migrations_dir = "migrations_d1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private"

[vars]
NODE_ENV = "production"

# R3 — Giới hạn tần suất ở cửa vào Worker (binding Rate Limiting, miễn phí). Đếm theo IP, theo từng điểm
# Cloudflare, gần đúng (bộ lọc lỏng). Chu kỳ chỉ được 10 hoặc 60 giây. Xem src/server/security/edgeLimit.ts.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "2101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "2102"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_READ"
namespace_id = "2103"
simple = { limit = 300, period = 60 }

# R3 — Workers Logs: lưu log 7 ngày, xem ở Cloudflare → Workers → websitetaxuatrip → Logs. Miễn phí trong hạn mức gói Free.
[observability]
enabled = true
head_sampling_rate = 1

# N05.2 — mỗi 5 phút dọn giữ chỗ quá hạn (src/worker.ts scheduled). Cron miễn phí trên gói Workers Free.
[triggers]
# R3: "17 20 * * SAT" = 20:17 UTC thứ Bảy = 03:17 Chủ nhật giờ VN. Cloudflare đánh số 1=Chủ nhật…7=thứ Bảy (khác cron Unix) nên dùng chữ SAT cho rõ; bắt đầu sao lưu D1 sang R2 riêng tư (src/server/backup/d1Backup.ts).
crons = ["*/5 * * * *", "17 20 * * SAT"]

# Bản xem trước cho các nhánh khác main (Workers Builds chạy `npx wrangler preview`).
# Dùng tài nguyên riêng, không đụng D1/R2 production. NODE_ENV = production để đăng ký/đăng nhập
# bị chặn (503) cho tới khi thêm TURNSTILE_SECRET_KEY ở mục Previews Base của Worker.
[previews.vars]
NODE_ENV = "production"

[[previews.d1_databases]]
binding = "DB"
database_id = "22280e1e-e2b5-4bec-9473-122d81a0098c"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "taxua-trip-media-preview"

[[previews.r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "taxua-trip-private-preview"
