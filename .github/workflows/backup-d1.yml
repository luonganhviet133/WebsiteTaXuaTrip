name: Sao lưu D1 hằng tuần

# R3 — Xuất toàn bộ D1 production ra .sql, nén, lưu vào bucket R2 RIÊNG TƯ `taxua-trip-backups`.
# KHÔNG tải lên GitHub (kho này công khai; bản sao lưu có email, SĐT, băm mật khẩu).
# Cần 2 secret do chủ dự án tự nhập (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token có quyền Account: D1 Edit + Workers R2 Storage Edit
#   CLOUDFLARE_ACCOUNT_ID — mã tài khoản Cloudflare
# Chạy tay: tab Actions → "Sao lưu D1 hằng tuần" → Run workflow. Cách khôi phục: docs/implementation/UPGRADE_RUNBOOK.md mục 7.
on:
  schedule:
    # 20:17 UTC thứ Bảy = 03:17 sáng Chủ nhật giờ Việt Nam (ít khách). Xuất D1 tạm khóa truy vấn vài giây.
    - cron: '17 20 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: taxua-trip-db
      BUCKET: taxua-trip-backups
      WRANGLER: npx --yes wrangler@4.160.1
    steps:
      - name: Kiểm tra đã có secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (xem đầu tệp workflow)."
            exit 1
          fi

      - name: Checkout (lấy wrangler.toml)
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Xuất D1 production
        run: |
          set -euo pipefail
          $WRANGLER d1 export "$DB_NAME" --remote --output backup.sql > /dev/null
          # Bản xuất phải có cấu trúc và dữ liệu tài khoản; thiếu thì dừng, không ghi đè bản tốt.
          grep -q 'CREATE TABLE' backup.sql
          grep -q 'INSERT INTO "\?profiles"\?' backup.sql
          grep -q 'd1_migrations' backup.sql
          echo "SIZE=$(stat -c%s backup.sql)" >> "$GITHUB_ENV"

      - name: Nén và tính mã kiểm tra
        run: |
          set -euo pipefail
          gzip -9 backup.sql
          echo "SHA=$(sha256sum backup.sql.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "KEY=d1/$(date -u +%Y/%m)/${DB_NAME}-$(date -u +%Y-%m-%dT%H%MZ).sql.gz" >> "$GITHUB_ENV"

      - name: Tạo bucket riêng tư nếu chưa có
        run: |
          set -uo pipefail
          out=$($WRANGLER r2 bucket create "$BUCKET" 2>&1) || echo "$out" | grep -qi 'already exists' || { echo "$out"; exit 1; }

      - name: Lưu vào R2
        run: |
          set -euo pipefail
          $WRANGLER r2 object put "$BUCKET/$KEY" --file backup.sql.gz --content-type application/gzip --remote > /dev/null
          $WRANGLER r2 object put "$BUCKET/d1/LATEST.txt" --pipe --content-type text/plain --remote > /dev/null <<< "$KEY $SHA"

      - name: Tóm tắt (không chứa dữ liệu)
        run: |
          {
            echo "### Sao lưu D1"
            echo "- Tệp: \`$BUCKET/$KEY\`"
            echo "- Dung lượng trước nén: $SIZE byte"
            echo "- SHA-256 bản nén: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Xóa tệp tạm
        if: always()
        run: rm -f backup.sql backup.sql.gz
